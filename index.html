<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photos</title>
    <meta name="description" content="Photos">
    <meta name="author" content="Derek Thatcher @ castlehillbasin.co.nz">
    <meta property="og:image" content="chb.png" />
    <meta property="og:image:secure_url" content="chb.png" />
    <meta name="MobileOptimized" content="width" />
    <meta name="HandheldFriendly" content="true" />
    <link id="site-favicon" rel="icon" type="image/x-icon" href="/photos/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Asap+Sharp:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>

<body>
    <header>
        <div class="site-title" id="site-title">Portfolio</div>
        <button id="menu-toggle" class="menu-toggle" aria-label="Toggle navigation"
            onclick="toggleMobileMenu(event)">☰</button>
        <div class="header-controls" id="header-controls">
            <nav id="nav-menu"></nav>
            <div class="sort-container">
                <button id="sort-desc" class="sort-btn active" title="Sort by Newest" aria-label="Sort newest first"
                    onclick="setSortOrder('desc')">↓</button>
                <span class="sort-divider">/</span>
                <button id="sort-asc" class="sort-btn" title="Sort by Oldest" aria-label="Sort oldest first"
                    onclick="setSortOrder('asc')">↑</button>
            </div>
        </div>
    </header>

    <main>
        <div id="gallery" class="gallery-grid"></div>
    </main>

    <!-- 3-State Lightbox Element -->
    <div id="lightbox" onclick="cycleLightboxState(event)">
        <button class="lightbox-close" title="Close (ESC)" onclick="closeLightbox(event)">✕</button>
        <img id="lightbox-img" src="" alt="" />
        <div id="lightbox-overlay">
            <div id="meta-title" class="meta-title"></div>
            <div id="meta-desc" class="meta-desc"></div>
            <div class="meta-footer">
                <div id="meta-exif" class="meta-exif"></div>
                <button id="meta-zoom" class="meta-zoom" type="button" title="Zoom High-Res Image"
                    onclick="toggleZoom(event)">🔍</button>
            </div>
        </div>
    </div>

    <footer>
        <p id="footer-about" class="footer-about"></p>
        <div id="footer-social" class="footer-social"></div>
    </footer>

    <script src="js/main.js"></script>
</body>

</html>
