<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <style>
        :root {
            --bg-color: #0d0d0e;
            --text-color: #f0f0f0;
        }

        /* Reset & Dark Mode Theme */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
        }

        /* Header & Navigation */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 32px;
            background-color: var(--bg-color);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(12px);
        }

        .site-title {
            font-size: 1.2rem;
            font-weight: 500;
            letter-spacing: 0.05em;
        }

        nav {
            display: flex;
            gap: 24px;
        }

        nav a {
            color: #777;
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.2s ease;
            cursor: pointer;
        }

        nav a:hover,
        nav a.active {
            color: var(--text-color);
            font-weight: 600;
        }

        /* Masonry Gallery Grid */
        main {
            padding: 16px 32px 64px;
        }

        .gallery-grid {
            column-count: 3;
            column-gap: 20px;
        }

        @media (max-width: 1024px) {
            .gallery-grid {
                column-count: 2;
            }
        }

        @media (max-width: 600px) {
            .gallery-grid {
                column-count: 1;
                padding: 16px;
            }
        }

        .gallery-item {
            break-inside: avoid;
            margin-bottom: 20px;
            overflow: hidden;
            border-radius: 4px;
            background-color: var(--bg-color);
        }

        .gallery-item img {
            width: 100%;
            height: auto;
            display: block;
            cursor: pointer;
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        .gallery-item img:hover {
            transform: scale(1.02);
            filter: brightness(1.05);
        }

        /* 3-State Lightbox Container */
        #lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-color);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            cursor: pointer;
            user-select: none;
        }

        #lightbox-img {
            max-width: 95vw;
            max-height: 95vh;
            object-fit: contain;
        }

        /* Metadata Overlay Panel (State 2) */
        #lightbox-overlay {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background-color: color-mix(in srgb, var(--bg-color) 85%, transparent);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 24px 32px;
            border-radius: 12px;
            max-width: 600px;
            width: 90%;
            color: var(--text-color);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            text-align: center;
        }

        #lightbox-overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .meta-title {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .meta-desc {
            font-size: 0.9rem;
            color: color-mix(in srgb, var(--text-color) 75%, transparent);
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .meta-exif {
            font-size: 0.8rem;
            color: color-mix(in srgb, var(--text-color) 55%, transparent);
            letter-spacing: 0.04em;
            text-transform: uppercase;
            border-top: 1px solid color-mix(in srgb, var(--text-color) 10%, transparent);
            padding-top: 12px;
        }

        .status-msg {
            text-align: center;
            padding: 100px;
            color: #666;
        }

        /* Subtle Sort Controls */
        /* Arrow Sort Controls */
        .header-controls {
            display: flex;
            align-items: center;
            gap: 32px;
        }

        .sort-container {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
        }

        .sort-btn {
            background: none;
            border: none;
            color: color-mix(in srgb, var(--bg-text) 55%, transparent);
            font-size: 1.05rem;
            line-height: 1;
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 3px;
            transition: color 0.2s ease, transform 0.15s ease;
        }

        .sort-btn:hover {
            color: color-mix(in srgb, var(--bg-text) 65%, transparent);;
        }

        .sort-btn.active {
            color: color-mix(in srgb, var(--bg-text) 85%, transparent);;
            font-weight: bold;
        }

        .sort-divider {
            color: color-mix(in srgb, var(--bg-text) 55%, transparent);;
            font-size: 0.8rem;
            user-select: none;
        }

        /* Footer Styling */
        footer {
            padding: 48px 32px 40px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            text-align: center;
        }

        .footer-about {
            max-width: 600px;
            font-size: 0.9rem;
            opacity: 0.7;
            line-height: 1.6;
        }

        .footer-social {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .footer-social a {
            color: var(--text-color);
            text-decoration: none;
            font-size: 0.85rem;
            opacity: 0.5;
            transition: opacity 0.2s ease;
        }

        .footer-social a:hover {
            opacity: 1;
        }
    </style>
</head>

<body>

    <header>
        <div class="site-title" id="site-title">Loading...</div>
        <div class="header-controls">
            <nav id="nav-menu"></nav>
            <div class="sort-container">
                <button id="sort-desc" class="sort-btn active" title="Sort by Newest" aria-label="Sort newest first"
                    onclick="setSortOrder('desc')">↓</button>
                <span class="sort-divider">/</span>
                <button id="sort-asc" class="sort-btn" title="Sort by Oldest" aria-label="Sort oldest first"
                    onclick="setSortOrder('asc')">↑</button>
            </div>
        </div>
    </header>

    <main>
        <div id="gallery" class="gallery-grid"></div>
    </main>

    <!-- 3-State Lightbox Element -->
    <div id="lightbox" onclick="handleLightboxClick()">
        <img id="lightbox-img" src="" alt="" />
        <div id="lightbox-overlay">
            <div class="meta-title" id="meta-title"></div>
            <div class="meta-desc" id="meta-desc"></div>
            <div class="meta-exif" id="meta-exif"></div>
        </div>
    </div>

    <footer>
        <p id="footer-about" class="footer-about"></p>
        <div id="footer-social" class="footer-social"></div>
    </footer>

    <script>
        let siteConfig = null;
        let currentAlbumData = [];
        let lightboxState = 0; // 0: Hidden, 1: Fullscreen Photo, 2: Metadata Overlay
        let currentSortOrder = 'desc';

        const galleryEl = document.getElementById('gallery');
        const lightboxEl = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const overlayEl = document.getElementById('lightbox-overlay');

        // 1. App Initialization
        async function init() {
            try {
                const res = await fetch('config.json?cachebust=' + Date.now());
                siteConfig = await res.json();

                // 1. Apply Dynamic Colors
                if (siteConfig.bgColor) {
                    document.documentElement.style.setProperty('--bg-color', siteConfig.bgColor);
                }
                if (siteConfig.textColor) {
                    document.documentElement.style.setProperty('--text-color', siteConfig.textColor);
                }

                // 2. Set Site Title
                document.getElementById('site-title').innerText = siteConfig.siteTitle || 'Portfolio';

                // 3. Render Footer
                const aboutEl = document.getElementById('footer-about');
                const socialEl = document.getElementById('footer-social');

                aboutEl.innerText = siteConfig.about || '';
                socialEl.innerHTML = '';

                if (siteConfig.socialLinks && Array.isArray(siteConfig.socialLinks)) {
                    siteConfig.socialLinks.forEach(link => {
                        if (link.label && link.url) {
                            const a = document.createElement('a');
                            a.innerText = link.label;
                            console.log('social:', link.label);
                            a.href = link.url;
                            a.target = '_blank';
                            a.rel = 'noopener noreferrer';
                            socialEl.appendChild(a);
                        }
                    });
                }

                renderNavigation();
                if (siteConfig.navigation && siteConfig.navigation.length > 0) {
                    loadAlbum(siteConfig.navigation[0].dataFile, 0);
                }
            } catch (err) {
                console.error('Failed to load config.json:', err);
            }
        }

        // 2. Dynamic Navigation Rendering
        function renderNavigation() {
            const navEl = document.getElementById('nav-menu');
            navEl.innerHTML = '';
            siteConfig.navigation.forEach((item, index) => {
                const link = document.createElement('a');
                link.innerText = item.label;
                link.onclick = (e) => {
                    e.preventDefault();
                    loadAlbum(item.dataFile, index);
                };
                if (index === 0) link.classList.add('active');
                navEl.appendChild(link);
            });
        }

        // 3. Album Fetching
        async function loadAlbum(dataFile, navIndex) {
            const navLinks = document.querySelectorAll('nav a');
            navLinks.forEach((link, idx) => link.classList.toggle('active', idx === navIndex));

            galleryEl.innerHTML = '<div class="status-msg">Loading photos...</div>';

            try {
                const res = await fetch(dataFile);
                currentAlbumData = await res.json();
                sortAndRender();
            } catch (err) {
                console.error(`Failed to load ${dataFile}:`, err);
                galleryEl.innerHTML = `<div class="status-msg">Unable to load album file: ${dataFile}</div>`;
            }
        }

        // Toggle sort direction
        function setSortOrder(order) {
            currentSortOrder = order;

            document.getElementById('sort-desc').classList.toggle('active', order === 'desc');
            document.getElementById('sort-asc').classList.toggle('active', order === 'asc');

            sortAndRender();
        }

        // Sort array by Date Taken before calling renderGallery()
        function sortAndRender() {
            if (!currentAlbumData || currentAlbumData.length === 0) return;

            currentAlbumData.sort((a, b) => {
                const dateA = new Date(a.dateTaken || a.exif?.date || 0).getTime();
                const dateB = new Date(b.dateTaken || b.exif?.date || 0).getTime();

                return currentSortOrder === 'desc' ? dateB - dateA : dateA - dateB;
            });

            renderGallery();
        }

        // 4. Masonry Grid Rendering
        function renderGallery() {
            galleryEl.innerHTML = '';
            currentAlbumData.forEach((photo) => {
                const item = document.createElement('div');
                item.className = 'gallery-item';

                const img = document.createElement('img');
                img.src = photo.thumbUrl;
                img.alt = photo.title || 'Photo';
                img.loading = 'lazy';
                img.onerror = () => {
                    item.remove();
                };
                img.onclick = () => openLightbox(photo);

                item.appendChild(img);
                galleryEl.appendChild(item);
            });
        }

        // 5. Lightbox Interactions (3-State Logic)
        function openLightbox(photo) {
            lightboxImg.src = photo.fullUrl;

            document.getElementById('meta-title').innerText = photo.title || '';
            document.getElementById('meta-desc').innerText = photo.description || '';

            const exif = photo.exif || {};
            const exifParts = [exif.camera, exif.lens, exif.fStop, exif.shutter].filter(
                val => val && val !== 'N/A'
            );
            document.getElementById('meta-exif').innerText = exifParts.join(' • ');

            lightboxState = 1; // Transition to State 1 (Fullscreen Photo)
            updateLightboxUI();
        }

        function handleLightboxClick() {
            if (lightboxState === 1) {
                lightboxState = 2; // Transition to State 2 (Metadata Overlay)
            } else if (lightboxState === 2) {
                lightboxState = 0; // Transition to State 0 (Close)
            }
            updateLightboxUI();
        }

        function updateLightboxUI() {
            if (lightboxState === 0) {
                lightboxEl.style.display = 'none';
                overlayEl.classList.remove('visible');
            } else if (lightboxState === 1) {
                lightboxEl.style.display = 'flex';
                overlayEl.classList.remove('visible');
            } else if (lightboxState === 2) {
                lightboxEl.style.display = 'flex';
                overlayEl.classList.add('visible');
            }
        }

        // Close on ESC key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && lightboxState !== 0) {
                lightboxState = 0;
                updateLightboxUI();
            }
        });

        init();
    </script>
</body>

</html>
